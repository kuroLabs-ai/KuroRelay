[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kurorelay"
version = "0.1.0"
description = "KuroRelay — Desktop API Development, Testing & Automation Environment"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kuro-Labs" }
]
dependencies = [
    "pywebview>=5.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "structlog>=24.1.0",
    "keyring>=25.2.0",
    "PyYAML>=6.0",
    "jsonschema>=4.22.0",
    "websockets>=12.0",
    "graphql-core>=3.2.0",
    "httpx-sse>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
kurorelay = "kurorelay.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
